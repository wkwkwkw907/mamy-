<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Lilin Ulang Tahun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,600&display=swap">
<style>
/* Tata letak: satu layar malam dengan lilin 3D di tengah. Setelah lilin diketuk,
   ucapan dan foto polaroid bergulir ke bawah dalam satu kolom sempit,
   foto berselang-seling kiri dan kanan. */
:root{
  color-scheme:dark;
  --night:#150e1d;
  --plum:#2d1633;
  --rose:#f2a7b9;
  --cream:#fff0dd;
  --flame:#ffc46b;
  --ember:#ff7b4f;
  --muted:#cdb9c8;
  --ink:#3b2433;
  --paper:#fff4e4;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- latar ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% -5%,rgba(125,52,112,.55),transparent 62%),
    radial-gradient(100% 55% at 50% 108%,rgba(112,32,62,.5),transparent 70%),
    var(--night)}
.bg i{position:absolute;display:block;border-radius:50%;opacity:.5;
  background:radial-gradient(circle,rgba(255,214,160,.55),rgba(255,150,180,.14) 55%,transparent 72%);
  animation:drift var(--d,18s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--x,20px),var(--y,-40px),0) scale(1.12)}}

/* ---------- hero ---------- */
.hero{position:relative;z-index:1;display:flex;flex-direction:column;
  min-height:600px;min-height:max(600px,calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));
  overflow:hidden;user-select:none;-webkit-user-select:none}
.hero-glow{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:1;transition:opacity 1.4s ease;
  background:radial-gradient(60% 34% at 50% 46%,rgba(255,150,70,.26),transparent 70%)}
.hero[data-flame="out"] .hero-glow{opacity:.18}
.stage{position:absolute;inset:0;z-index:1;touch-action:pan-y;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage canvas{display:block;width:100%;height:100%}
#bunting{position:absolute;left:0;top:0;width:100%;height:96px;z-index:2;pointer-events:none;display:block;overflow:visible}
.hero-top{position:relative;z-index:3;pointer-events:none;text-align:center;padding-top:clamp(64px,10.5vh,104px)}
.hello{margin:0 0 .55rem;font-size:.95rem;color:var(--muted);letter-spacing:.02em}
.title{margin:0;font-family:var(--display);font-style:italic;font-weight:300;line-height:1.04;font-size:clamp(1.65rem,7vw,2.4rem);text-wrap:balance}
.title .nm{display:block;margin-top:.06em;font-weight:600;font-size:clamp(2.9rem,15.5vw,4.7rem);letter-spacing:-.02em;color:var(--flame);
  text-shadow:0 0 30px rgba(255,170,80,.38);overflow-wrap:anywhere}
.hero-top>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-top .title{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hero-bottom{position:relative;z-index:3;margin-top:auto;pointer-events:none;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.35rem;
  min-height:calc(9.6rem + max(22px,env(safe-area-inset-bottom,0px)));padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.hero-bottom>*{pointer-events:auto}
.wish{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:1.12rem;line-height:1.35;color:var(--cream);max-width:22rem;text-wrap:balance;pointer-events:none}
.tap{position:relative;display:inline-flex;align-items:center;gap:.55rem;min-height:50px;padding:.8rem 1.5rem;margin-top:.55rem;
  border-radius:999px;border:1px solid rgba(255,240,221,.34);background:rgba(255,240,221,.1);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:600;font-size:1rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .2s,transform .2s}
.tap:active{transform:scale(.97)}
.tap::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid rgba(255,196,107,.7);animation:ping 2.2s ease-out infinite;pointer-events:none}
.hero[data-flame="out"] .tap::after{animation:none;opacity:0}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.28,1.5);opacity:0}}
.tap svg{width:18px;height:18px;flex:none}
.sub{background:none;border:0;padding:.6rem 1rem;min-height:44px;color:var(--muted);font-size:.9rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:where(button,a):focus-visible{outline:2px solid var(--flame);outline-offset:3px}

/* cadangan jika WebGL tidak ada */
.fb{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:200px;display:flex;flex-direction:column;align-items:center}
.fb-flame{width:36px;height:70px;margin-bottom:-6px;border-radius:50% 50% 50% 50%/64% 64% 36% 36%;transform-origin:50% 100%;
  background:radial-gradient(ellipse at 50% 78%,#fff6cf 0 16%,#ffcf6b 40%,#ff8a3d 72%,rgba(255,120,60,0) 100%);
  box-shadow:0 0 44px 16px rgba(255,170,80,.45);animation:flick .2s ease-in-out infinite alternate;transition:transform .5s,opacity .5s}
.hero[data-flame="out"] .fb-flame{transform:scale(.05);opacity:0;animation:none}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.06) rotate(2deg)}}
.fb-wick{width:3px;height:14px;background:#2b1b16}
.fb-candle{width:34px;height:150px;border-radius:5px;background:repeating-linear-gradient(135deg,#fff3e6 0 11px,#f28fb0 11px 22px)}
.fb-tier{height:62px;border-radius:12px;background:#fff0dc;width:170px;margin-top:-2px}
.fb-tier+.fb-tier{height:70px;width:230px;background:#f6b3c4;margin-top:-4px}

/* ---------- cerita ---------- */
.story{position:relative;z-index:1;overflow-x:clip}
.story-inner{display:flex;flex-direction:column;gap:clamp(40px,9vh,68px);
  width:100%;max-width:30rem;margin:0 auto;padding-block:clamp(56px,12vh,100px) 150px}
.lead{margin:0;color:var(--muted);font-size:1.05rem}
.words{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(1.5rem,6.6vw,1.95rem);line-height:1.36;letter-spacing:-.005em;text-wrap:pretty;overflow-wrap:break-word}
.reveal{transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.js-io .reveal.pre{opacity:0;transform:translateY(26px) rotate(var(--r,0deg))}

.polaroid{--r:-2deg;position:relative;margin:0;width:min(80%,19rem);padding:10px 10px 0;background:#fff7ec;border-radius:3px;
  box-shadow:0 22px 40px -18px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.25);transform:rotate(var(--r));align-self:flex-start}
.polaroid.right{align-self:flex-end}
.tape{position:absolute;top:-11px;left:50%;width:86px;height:24px;margin-left:-43px;transform:rotate(-3deg);
  background:rgba(242,167,185,.62);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.polaroid.right .tape{transform:rotate(4deg)}
.pl-photo{position:relative;aspect-ratio:4/5;overflow:hidden;background:#e8d7c8}
.pl-photo>*{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter 2.6s ease .3s}
.pl-photo img{object-fit:cover}
.js-io .pre .pl-photo>*{filter:grayscale(1) sepia(.5) blur(6px) brightness(1.5) contrast(.75)}
.pl-photo.has-img .pl-empty{display:none}
.pl-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;color:rgba(59,36,51,.58);font-family:var(--hand);font-size:1.3rem}
.pl-empty svg{width:42px;height:42px}
.polaroid figcaption{padding:.8rem .4rem .95rem;text-align:center;font-family:var(--hand);font-weight:500;font-size:1.45rem;line-height:1.15;color:var(--ink);text-wrap:balance}

.letter{--r:-.6deg;background:var(--paper);color:var(--ink);padding:1.7rem 1.45rem 1.6rem;border-radius:4px;transform:rotate(var(--r));
  box-shadow:0 24px 44px -20px rgba(0,0,0,.75)}
.letter h2{margin:0 0 .9rem;font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.2}
.letter p{margin:0 0 .85rem;font-size:1.02rem;line-height:1.7}
.letter .sign{margin:1.25rem 0 0;font-family:var(--hand);font-weight:600;font-size:1.65rem;line-height:1.15}
.closing{display:flex;flex-direction:column;align-items:center;gap:1.4rem;text-align:center;padding-top:1rem}
.closing .big{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.15;text-wrap:balance}
.closing .big em{display:block;font-weight:600;color:var(--flame);overflow-wrap:anywhere}

/* ---------- tombol musik & konfeti ---------- */
.music{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,240,221,.32);background:rgba(21,14,29,.66);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;padding:0}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{display:block;width:3px;height:5px;border-radius:2px;background:var(--cream)}
.music.on .eq i{animation:eq 1.1s ease-in-out infinite}
.music.on .eq i:nth-child(2){animation-delay:-.45s}
.music.on .eq i:nth-child(3){animation-delay:-.8s}
.music:not(.on)::after{content:"";position:absolute;width:24px;height:2px;border-radius:2px;background:var(--rose);transform:rotate(-45deg)}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.confetti{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;perspective:700px}
.confetti i{position:absolute;display:block;border-radius:1px;will-change:transform}

@media (max-height:660px){
  .hero-top{padding-top:58px}
  .hello{margin-bottom:.3rem}
  .title{font-size:1.45rem}
  .title .nm{font-size:2.6rem}
  .wish{font-size:1rem}
}
@media (max-height:520px){
  .hero{min-height:520px}
  .hero-top{padding-top:50px}
  .hello{display:none}
  .title{font-size:1.25rem}
  .title .nm{font-size:2.1rem}
  .hero-bottom{min-height:calc(7.8rem + max(14px,env(safe-area-inset-bottom,0px)));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
  .wish{font-size:.95rem}
  .tap{min-height:44px;padding:.55rem 1.3rem;margin-top:.3rem}
}
@media (min-width:700px){
  .hero-top{padding-top:clamp(72px,11vh,120px)}
  .story-inner{max-width:34rem}
}
@media (prefers-reduced-motion:reduce){
  .bg i,.tap::after,.fb-flame{animation:none}
  .hero-top>*{animation:none}
  .reveal{transition:none}
  .js-io .reveal.pre{opacity:1;transform:rotate(var(--r,0deg))}
  .js-io .pre .pl-photo>*{filter:none}
  .pl-photo>*{transition:none}
  .music.on .eq i{animation:none;height:12px}
}
</style>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true"></div>

<main>
  <section class="hero" id="hero" data-flame="on" aria-label="Lilin ulang tahun">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="stage" id="stage" aria-hidden="true">
      <div class="fb" id="fb" hidden>
        <div class="fb-flame"></div><div class="fb-wick"></div><div class="fb-candle"></div>
        <div class="fb-tier"></div><div class="fb-tier"></div>
      </div>
    </div>
    <svg id="bunting" aria-hidden="true" focusable="false"></svg>

    <header class="hero-top wrap">
      <p class="hello" id="hello">This your dayy yeyyy!!!</p>
      <h1 class="title">Happy Level Up Dayy<span class="nm" id="nama"> Mamy rara</span></h1>
    </header>

    <div class="hero-bottom wrap">
      <p class="wish" id="wish" aria-live="polite">Pejamkan mata dan buat satu permohonan.</p>
      <button class="tap" id="tapBtn" type="button">
        <span id="tapLabel">Ketuk lilinnya</span>
        <svg id="tapIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="sub" id="subBtn" type="button" hidden>scrool ke bawah</button>
    </div>
  </section>

  <section class="story" id="story" aria-label="Ucapan ulang tahun" hidden>
    <div class="story-inner wrap" id="storyInner"></div>
  </section>
</main>

<button class="music" id="musicBtn" type="button" aria-pressed="false" aria-label="Putar musik">
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
</button>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   UBAH BAGIAN INI SAJA
   Semua tulisan, nama, foto, dan musik diatur di sini.
   - foto: taruh file foto di folder yang sama dengan file ini,
           lalu samakan namanya (mis. foto1.jpg). Jika foto tidak ada,
           kotak foto kosong yang manis akan tampil.
   - musikFile: isi dengan nama file lagu (mis. "lagu.mp3") jika ingin
           memakai lagu sendiri. Kosongkan untuk musik kotak musik bawaan.
   ===================================================================== */
var CONFIG = {
  nama: "Mamy rara",
  dari: "hiroo",
  salam: "This is your dayy yeyy!!",
  musikFile: "",
  pengantar: "Ini beberapa hal yang ingin kusampaikan",
  kataKata: [
    "Selamat ulang tahun mamy",
    "Terima kasih sudah hadir, dan membimbing aku.",
    "Semoga ulang tahun ini membawa kebaikan untuk sekarang dan masa yang akan datang.",
    "Semoga kamu tetap bisa menjaga ketujuh anak mu dan selalu sabar,jangan nambah lagi oi."
  ],
  foto: [
    { src: "foto1.jpg", caption: "Hari pertama aku di adopsi" },
    { src: "foto2.jpg", caption: "Hari biasa yang jadi istimewa" },
    { src: "foto3.jpg", caption: "I love this fam" },
    { src: "foto4.jpg", caption: "i lopyu mamy" }
  ],
  suratJudul: "Sedikit pesan untukmu",
  surat: [
    "Bertambah umur bukan soal angka. Ini soal berapa banyak hal yang sudah kamu lewati dan berapa banyak yang masih menunggumu di depan.",
    "ku harap kami adalah salah satu bagian hidup mu, bukan hanya pada layar kaca, lebih dari itu kita adalah keluarga."
  ],
  penutup: "from your child,"
};
/* ===================== akhir bagian yang diubah ===================== */

var $ = function(s, r){ return (r || document).querySelector(s); };
var reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
var HAS_IO = 'IntersectionObserver' in window;
if (HAS_IO) document.documentElement.classList.add('js-io');

/* nama bisa diganti lewat alamat, mis. ?nama=Sinta */
try {
  var qn = new URLSearchParams(location.search).get('nama');
  if (qn && qn.trim()) CONFIG.nama = qn.trim().slice(0, 40);
} catch (e) {}

/* =====================================================================
   SUARA: musik kotak musik buatan sendiri (Web Audio) + efek klik
   ===================================================================== */
var Sound = (function(){
  var ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  var started = false, on = true, timer = 0, fileEl = null, useFile = false, synthOn = false, iosEl = null;
  var BPM = 84, SPB = 60 / BPM, AHEAD = 1.6, LOOP = 37;
  var events = null, idx = 0, loopStart = 0;
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function build(){
    var ev = [], b = 0;
    var N = {G4:67, A4:69, B4:71, C5:72, D5:74, E5:76, F5:77, G5:79};
    /* melodi "Selamat Ulang Tahun" (Happy Birthday), 3/4, diawali satu ketukan anakrusis */
    var mel = [['G4',.75],['G4',.25],
      ['A4',1],['G4',1],['C5',1],
      ['B4',2],['G4',.75],['G4',.25],
      ['A4',1],['G4',1],['D5',1],
      ['C5',2],['G4',.75],['G4',.25],
      ['G5',1],['E5',1],['C5',1],
      ['B4',1],['A4',1],['F5',.75],['F5',.25],
      ['E5',1],['C5',1],['D5',1],
      ['C5',3]];
    mel.forEach(function(m){ ev.push({b:b, k:'lead', n:N[m[0]], d:m[1]}); b += m[1]; });
    var CH = {
      C:{bass:48, a:55, c:64, pad:[55,60,64]},
      G:{bass:43, a:50, c:59, pad:[55,59,62]}
    };
    ['C','G','G','C','C','G','C','C'].forEach(function(ch, i){
      var b0 = 1 + i * 3, c = CH[ch];
      ev.push({b:b0, k:'bass', n:c.bass, d:2.2});
      ev.push({b:b0 + 1, k:'comp', n:c.a});
      ev.push({b:b0 + 2, k:'comp', n:c.c});
    });
    [['C',1,3],['G',4,6],['C',10,6],['G',16,3],['C',19,6]].forEach(function(p){
      ev.push({b:p[1], k:'pad', ns:CH[p[0]].pad, d:p[2]});
    });
    /* ekor: arpeggio lembut Am - F - C - G sebelum ulang dari awal */
    [
      {bass:45, pad:[57,60,64], arp:[57,60,64,69,64,60]},
      {bass:41, pad:[53,57,60], arp:[53,57,60,65,60,57]},
      {bass:48, pad:[55,60,64], arp:[60,64,67,72,67,64]},
      {bass:43, pad:[55,59,62], arp:[55,59,62,67,62,59]}
    ].forEach(function(t, i){
      var b0 = 25 + i * 3;
      ev.push({b:b0, k:'bass', n:t.bass, d:2.4});
      ev.push({b:b0, k:'pad', ns:t.pad, d:3});
      t.arp.forEach(function(n, j){ ev.push({b:b0 + j * .5, k:'arp', n:n, v:j === 0 ? .2 : .14}); });
    });
    ev.sort(function(x, y){ return x.b - y.b; });
    return ev;
  }

  function makeImpulse(sec, decay){
    var rate = ctx.sampleRate, len = Math.floor(rate * sec), buf = ctx.createBuffer(2, len, rate);
    for (var c = 0; c < 2; c++){
      var d = buf.getChannelData(c), last = 0;
      for (var i = 0; i < len; i++){
        last = last * .55 + (Math.random() * 2 - 1) * .45;
        d[i] = last * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }
  function getNoise(){
    if (noiseBuf) return noiseBuf;
    var len = Math.floor(ctx.sampleRate * 1), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = buf; return buf;
  }

  function init(){
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { ctx = null; return null; }
    master = ctx.createGain(); master.gain.value = on ? 1 : 0;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 3.5; comp.attack.value = .01; comp.release.value = .25;
    master.connect(comp); comp.connect(ctx.destination);
    var rev = ctx.createConvolver(); rev.buffer = makeImpulse(2.6, 2.6);
    var revOut = ctx.createGain(); revOut.gain.value = .6; rev.connect(revOut); revOut.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
    var mSend = ctx.createGain(); mSend.gain.value = .5; musicBus.connect(mSend); mSend.connect(rev);
    sfxBus = ctx.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
    var sSend = ctx.createGain(); sSend.gain.value = .35; sfxBus.connect(sSend); sSend.connect(rev);
    ctx.onstatechange = function(){
      if (ctx && on && started && !document.hidden && (ctx.state === 'suspended' || ctx.state === 'interrupted')) { try { ctx.resume(); } catch (e) {} }
    };
    return ctx;
  }

  function ramp(param, v, secs){
    try {
      var t = ctx.currentTime;

      cylinder(x, CANDLE_TOP - d[1] / 2, z, .03, .03, d[1], 10, cream, [.45, 28], null, 0);

  function buf(target, data, usage){ var b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, usage); return b; }
  var meshVB = buf(gl.ARRAY_BUFFER, new Float32Array(V), gl.STATIC_DRAW);

  var meshCount = I.length;
  if (V.length / 13 > 65000) throw new Error('mesh terlalu besar');

  var flameVB = buf(gl.ARRAY_BUFFER, new Float32Array([-1,0, 1,0, 1,1, -1,1]), gl.STATIC_DRAW);
  var flameIB = buf(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);

  var MAXP = 140, PF = 11;
  var pData = new Float32Array(MAXP * 4 * PF);
  var pVB = buf(gl.ARRAY_BUFFER, pData, gl.DYNAMIC_DRAW);
  var pIdx = new Uint16Array(MAXP * 6);
  for (var q = 0; q < MAXP; q++){ var o = q * 4; pIdx.set([o, o + 1, o + 2, o, o + 2, o + 3], q * 6); }
  var pIB = buf(gl.ELEMENT_ARRAY_BUFFER, pIdx, gl.STATIC_DRAW);
  var pN = 0;
  var CORN = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  function P(x, y, z, size, pw, r, g, b, a){
    if (pN >= MAXP) return;
    var base = pN * 4 * PF;
    for (var k = 0; k < 4; k++){
      var i = base + k * PF;
      pData[i] = x; pData[i + 1] = y; pData[i + 2] = z; pData[i + 3] = CORN[k][0]; pData[i + 4] = CORN[k][1];
      pData[i + 5] = size; pData[i + 6] = pw; pData[i + 7] = r; pData[i + 8] = g; pData[i + 9] = b; pData[i + 10] = a;

  /* ---- matriks ---- */
  var proj = new Float32Array(16), view = new Float32Array(16), model = new Float32Array(16);
  function perspective(out, fovy, asp, n, f){

  }
  function lookAt(out, e, c, up){
    var zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2], l = 1 / Math.hypot(zx, zy, zz); zx *= l; zy *= l; zz *= l;
    var xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx; l = 1 / Math.hypot(xx, xy, xz); xx *= l; xy *= l; xz *= l;

  /* ---- keadaan ---- */
  var FOV = 32 * Math.PI / 180, LOOK_Y = 2.02, dist = 11, W = 1, H = 1, dpr = 1;
  var time = 0, last = 0, rot = 0, level = 0, target = 1, blowV = 0, ember = 0, visible = true;
  var eye = [0, 3, 11];
  var smoke = [];
  for (var s0 = 0; s0 < 14; s0++) smoke.push({age: -1, life: 2.4, x: 0, z: 0, seed: Math.random() * 6.28});
  var sparks = [];
  var pal = [[1, .78, .44], [.96, .66, .74], [1, .94, .86]];
  for (var s1 = 0; s1 < 56; s1++){
    var an = Math.random() * 6.283, rr = .95 + Math.random() * 1.7;
    sparks.push({x: Math.cos(an) * rr, y: .35 + Math.random() * 4.1, z: Math.sin(an) * rr * .85, sd: Math.random(), sz: .035 + Math.random() * .06, c: pal[s1 % 3]});
  }

  function resize(){
    var w = host.clientWidth, h = host.clientHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    var asp = w / h, tn = Math.tan(FOV / 2), band = null, shift = 0, dH = 7.5 / (2 * tn);
    try { band = getBand ? getBand() : null; } catch (e) { band = null; }
    if (band && band[1] - band[0] > 90){
      dH = 4.6 * h / ((band[1] - band[0]) * 2 * tn);

  function setCamera(){
    var sway = reduceMotion ? 0 : Math.sin(time * .22) * .32;

    lookAt(view, eye, [0, LOOK_Y, 0], [0, 1, 0]);
  }

  function useAttribs(n){ for (var i = 0; i < 4; i++){ if (i < n) gl.enableVertexAttribArray(i); else gl.disableVertexAttribArray(i); } }

    gl.viewport(0, 0, canvas.width, canvas.height);

    gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);

    var lc = .06 + 2.7 * level * (1 + .06 * n) + ember * .25;
    var ak = .8 + .2 * level;

    /* 1. kue */
    gl.useProgram(meshP);
    gl.uniformMatrix4fv(mU.uProj, false, proj); gl.uniformMatrix4fv(mU.uView, false, view); gl.uniformMatrix4fv(mU.uModel, false, model);
    gl.uniform3f(mU.uLP, 0, FLAME_BASE + .3, .12);
    gl.uniform3f(mU.uLC, 1.0 * lc, .72 * lc, .42 * lc);
    gl.uniform3f(mU.uEye, eye[0], eye[1], eye[2]);

    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 52, 0);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 52, 12);

    P(0, .25, 0, 3.0, 2.2, 1, .62, .34, .2 * level + .02);
    sparks.forEach(function(s){
      var tw = .5 + .5 * Math.sin(time * (.9 + s.sd * 1.6) + s.sd * 40);

    smoke.forEach(function(s){

    });

  function frame(now){

    }
  };

}

function drawBunting(){

  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var n = Math.max(7, Math.round(W / 46)), sag = Math.min(44, W * .1);
  var p0 = [-8, 6], p1 = [W / 2, 6 + sag * 2], p2 = [W + 8, 6];
  var cols = ['#f2a7b9', '#ffc46b', '#fff0dd', '#b9a2ee', '#8fd3b6', '#ff7b4f'];
  var out = '<path d="M' + p0 + ' Q' + p1 + ' ' + p2 + '" fill="none" stroke="rgba(255,240,221,.55)" stroke-width="1.3"/>';

    var dx = 2 * u * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]), dy = 2 * u * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);

    l.appendChild(h('h2', null, CONFIG.suratJudul || 'Untukmu'));
    CONFIG.surat.forEach(function(t){ l.appendChild(h('p', null, t)); });
    var sg = h('p', 'sign'); sg.appendChild(document.createTextNode(CONFIG.penutup || 'Dengan sayang,'));
    sg.appendChild(document.createElement('br')); sg.appendChild(document.createTextNode(CONFIG.dari || ''));
    l.appendChild(sg); add(l);
  }
  var c = h('footer', 'closing reveal');
  var big = h('p', 'big', 'Selamat ulang tahun,'); big.appendChild(h('em', null, CONFIG.nama));
  c.appendChild(big);
  var back = h('button', 'tap', 'Kembali ke lilin'); back.type = 'button'; back.style.marginTop = '0';
  back.addEventListener('click', function(){ window.scrollTo({top: 0, behavior: reduceMotion ? 'auto' : 'smooth'}); });
  c.appendChild(back); add(c);
}
var revealIO = null;
function showStory(){
  if (storyShown) return;
  storyShown = true;
  buildStory();
  storyEl.hidden = false;
  if (HAS_IO){
    revealIO = new IntersectionObserver(function(es){
      es.forEach(function(en){ if (en.isIntersecting){ en.target.classList.remove('pre'); revealIO.unobserve(en.target); } });
    }, {threshold: .15, rootMargin: '0px 0px -6% 0px'});
    Array.prototype.forEach.call(storyEl.querySelectorAll('.reveal'), function(e){ revealIO.observe(e); });
  }
}
function scrollToStory(){
  if (!storyShown) showStory();
  var top = storyEl.getBoundingClientRect().top + window.pageYOffset;
  window.scrollTo({top: top, behavior: reduceMotion ? 'auto' : 'smooth'});
}

/* aksi utama */
function lock(ms){ locked = true; setTimeout(function(){ locked = false; }, ms); }
function blow(){
  if (locked || flame === 'out') return;
  lock(900);
  flame = 'out'; blownOnce = true; setUI();
  Sound.unlock(); Sound.start(); Sound.pop(); Sound.puff(); Sound.chime();
  syncMusic();
  if (scene) { try { scene.blow(); } catch (e) {} }
  var p = flameXY(); confetti(p.x, p.y, 72);
  if (!storyShown) {
    setTimeout(function(){
      showStory();
      setTimeout(function(){
        if (window.pageYOffset < hero.offsetHeight * .5) scrollToStory();
      }, reduceMotion ? 50 : 900);
    }, reduceMotion ? 150 : 2000);
  }
}
function relight(){
  if (locked || flame === 'on') return;
  lock(900);
  flame = 'on'; relitOnce = true; setUI();
  Sound.unlock(); Sound.relight();
  if (scene) { try { scene.relight(); } catch (e) {} }
  var p = flameXY(); confetti(p.x, p.y, 22);
}
function syncMusic(){
  var on = Sound.isPlaying();
  musicBtn.classList.toggle('on', on);
  musicBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  musicBtn.setAttribute('aria-label', on ? 'Matikan musik' : 'Putar musik');
}

stage.addEventListener('click', function(){ if (flame === 'on') blow(); else relight(); });
tapBtn.addEventListener('click', function(){ if (flame === 'on') blow(); else scrollToStory(); });
subBtn.addEventListener('click', relight);
musicBtn.addEventListener('click', function(){
  Sound.unlock();
  if (!Sound.isStarted()) Sound.start(); else Sound.toggle();
  syncMusic();
});

/* mulai adegan 3D */
function getBand(){
  var sr = stage.getBoundingClientRect(), t = $('.hero-top').getBoundingClientRect(), b = $('.hero-bottom').getBoundingClientRect();
  return [t.bottom - sr.top + 8, b.top - sr.top - 6];
}
function refit(){ if (scene && scene.refit) { try { scene.refit(); } catch (e) {} } }
function useFallback(){ var fb = $('#fb'); if (fb) fb.hidden = false; scene = null; }
function startScene(){
  try {
    scene = createScene(stage, getBand);
    if (!scene) { useFallback(); return; }
    scene.onLost = function(){
      Array.prototype.forEach.call(stage.querySelectorAll('canvas'), function(c){ c.remove(); });
      useFallback();
    };
  } catch (e) {
    if (window.console) console.warn('Adegan 3D gagal dimuat, memakai tampilan cadangan.', e);
    Array.prototype.forEach.call(stage.querySelectorAll('canvas'), function(c){ c.remove(); });
    useFallback();
  }
}
startScene();
setUI();
syncMusic();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
window.addEventListener('load', function(){ refit(); setTimeout(refit, 700); });
})();
</script>
